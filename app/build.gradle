plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.numai5'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.numai5"
        minSdk 21
        targetSdk 28          // targetSdk 28 路线：避开 33+ 限制；仍需 disable ExpiredTargetSdkVersion
        versionCode 1
        versionName "1.0.0"
        setProperty("archivesBaseName", "numAi5-$versionName")
    }

    buildTypes {
        release {
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // targetSdk 28 < 33，lintVitalRelease 会报 ExpiredTargetSdkVersion 致命错误
    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // UI（Material 1.11 兼容 API 21+，提供 BottomSheet / Chip / CardView）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'

    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // Java 8+ API 在 API 21+ 可用（java.time 等）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
