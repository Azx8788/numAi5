plugins {
    id 'com.android.application'
}

// 发布签名（步骤23）：CI 从 secrets 解码 app/release.keystore 并注入环境变量；
// keystore 或环境变量缺失时跳过签名（产物为未签名 release，不影响其他构建）。
def releaseKeystoreFile = file('release.keystore')
def hasReleaseSigning = releaseKeystoreFile.exists()
        && System.getenv('RELEASE_KEYSTORE_PASSWORD') != null
        && System.getenv('RELEASE_KEY_ALIAS') != null
        && System.getenv('RELEASE_KEY_PASSWORD') != null

android {
    namespace 'io.github.numai5'
    compileSdk 34

    defaultConfig {
        applicationId "io.github.numai5"
        minSdk 21
        targetSdk 28          // targetSdk 28 路线：避开 33+ 限制；仍需 disable ExpiredTargetSdkVersion
        versionCode 2
        versionName "1.1.0"
        setProperty("archivesBaseName", "numAi5-$versionName")
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystoreFile
                storePassword System.getenv('RELEASE_KEYSTORE_PASSWORD')
                keyAlias System.getenv('RELEASE_KEY_ALIAS')
                keyPassword System.getenv('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // targetSdk 28 < 33，lintVitalRelease 会报 ExpiredTargetSdkVersion 致命错误
    lint {
        disable 'ExpiredTargetSdkVersion'
        abortOnError false
    }

    buildFeatures {
        buildConfig true
    }
}

dependencies {
    // UI（Material 1.11 兼容 API 21+，提供 BottomSheet / Chip / CardView）
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.android.material:material:1.11.0'

    // 网络
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'

    // JSON
    implementation 'com.google.code.gson:gson:2.10.1'

    // LaTeX 数学公式渲染（GPL-2.0 with Classpath Exception，允许与任意许可的独立模块链接）
    implementation 'ru.noties:jlatexmath-android:0.2.0'
    implementation 'ru.noties:jlatexmath-android-font-greek:0.2.0'

    // Java 8+ API 在 API 21+ 可用（java.time 等）
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
