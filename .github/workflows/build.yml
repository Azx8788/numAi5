name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-release:
    name: Build release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      # 缓存 Gradle 发行包（约 130MB），避免每次 CI 重新下载
      - name: Cache Gradle distribution
        uses: actions/cache@v4
        with:
          path: ~/.gradle/wrapper/dists
          key: gradle-dists-${{ runner.os }}-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties') }}

      - name: Install Android SDK packages
        run: |
          SDKMANAGER=$(command -v sdkmanager || echo "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager")
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - name: Stub local.properties
        run: |
          if [ ! -f local.properties ]; then
            echo "sdk.dir=$ANDROID_HOME" > local.properties
          fi

      # wrapper 三件套已入库；仅补可执行位，万一 jar 缺失再兜底重新生成
      - name: Prepare Gradle wrapper
        run: |
          chmod +x gradlew
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle wrapper --gradle-version 8.2 --distribution-type bin
          fi

      # 发版前拉取 curl.se 维护的最新 Mozilla 根证书包。
      # 任一步失败都沿用仓库内副本，不影响构建，避免上游故障阻断出包。
      - name: Refresh CA bundle
        run: |
          set +e
          curl -fsSL --retry 3 --max-time 60 -o /tmp/cacert.pem https://curl.se/ca/cacert.pem
          curl -fsSL --retry 3 --max-time 60 -o /tmp/cacert.pem.sha256 https://curl.se/ca/cacert.pem.sha256
          if [ ! -s /tmp/cacert.pem ] || [ ! -s /tmp/cacert.pem.sha256 ]; then
            echo "证书包下载失败，沿用仓库内副本"
            exit 0
          fi
          if ! (cd /tmp && sha256sum -c cacert.pem.sha256); then
            echo "校验失败，沿用仓库内副本"
            exit 0
          fi
          COUNT=$(grep -c '^-----BEGIN CERTIFICATE-----' /tmp/cacert.pem)
          if [ "$COUNT" -lt 60 ]; then
            echo "证书数量异常：$COUNT，沿用仓库内副本"
            exit 0
          fi
          if ! openssl crl2pkcs7 -nocrl -certfile /tmp/cacert.pem 2>/dev/null \
              | openssl pkcs7 -print_certs -noout 2>/dev/null \
              | grep -q 'ISRG Root X1'; then
            echo "缺少 ISRG Root X1，沿用仓库内副本"
            exit 0
          fi
          cp /tmp/cacert.pem app/src/main/assets/certs/cacert.pem
          cp /tmp/cacert.pem.sha256 app/src/main/assets/certs/cacert.pem.sha256
          echo "证书包已刷新，共 $COUNT 张"
          head -5 app/src/main/assets/certs/cacert.pem
          sha256sum app/src/main/assets/certs/cacert.pem

      # 签名 keystore 从 secrets 解码（步骤23）；secret 缺失时跳过，产出未签名 release
      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "RELEASE_KEYSTORE_BASE64 未配置，跳过签名。"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > app/release.keystore

      - name: Assemble release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          LANG: C.UTF-8
          LC_ALL: C.UTF-8
        run: ./gradlew --no-daemon assembleRelease

      - name: Upload release APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: numAi5-release-apk
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14
